services:
  - type: web
    name: sm64web-relay
    runtime: node
    plan: free
    region: ohio
    branch: work/web-multiplayer-networking
    rootDir: networking/relay
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MAX_PLAYERS
        value: "8"
