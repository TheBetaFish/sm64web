name: Browser multiplayer WebAssembly build

on:
  push:
    branches:
      - work/web-multiplayer-networking
  pull_request:
    branches:
      - work/web-multiplayer-networking
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-network-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-network-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Show toolchain
        run: |
          emcc --version
          command -v emmake

      - name: Build Lua for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o /tmp/lua-5.3.6.tar.gz
          tar -xzf /tmp/lua-5.3.6.tar.gz -C /tmp
          emmake make -C /tmp/lua-5.3.6/src generic CC=emcc 'AR=emar rcs' RANLIB=emranlib
          mkdir -p lib/lua/emscripten
          cp /tmp/lua-5.3.6/src/liblua.a lib/lua/emscripten/liblua53.a

      - name: Prepare zlib headers
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://zlib.net/fossils/zlib-1.3.1.tar.gz -o /tmp/zlib-1.3.1.tar.gz
          tar -xzf /tmp/zlib-1.3.1.tar.gz -C /tmp

      - name: Compile browser game and experimental relay adapter
        shell: bash
        run: |
          set -o pipefail
          emmake make -j2 CC=emcc CXX=em++ CC_CHECK=emcc DISCORD_SDK=0 COOPNET=0 UPDATER=0 ICON=0 EXE=build/us_pc/sm64coopdx.html EXTRA_CFLAGS="-I/tmp/zlib-1.3.1 -DUSE_GLES=1" LDFLAGS="-sUSE_SDL=2 -sUSE_ZLIB=1 -sMIN_WEBGL_VERSION=1 -sMAX_WEBGL_VERSION=1 -sALLOW_MEMORY_GROWTH=1 -sASSERTIONS=2 -sSTACK_OVERFLOW_CHECK=2 -sSTACK_SIZE=1048576 -sDEMANGLE_SUPPORT=1 -sEXPORTED_RUNTIME_METHODS=allocateUTF8,_free --profiling-funcs -gsource-map -Llib/lua/emscripten -llua53 -lm" 2>&1 | tee emscripten-browser-network-build.log

      - name: Check browser JavaScript syntax
        run: |
          node --check web/sm64web-ui.js
          node --check web/sm64web-relay-transport.js

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-browser-network-build-log
          path: emscripten-browser-network-build.log
          if-no-files-found: ignore

      - name: Upload compiled WebAssembly artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sm64web-browser-network-experimental
          path: |
            build/us_pc/*.html
            build/us_pc/*.js
            build/us_pc/*.wasm
            build/us_pc/*.data
          if-no-files-found: error
