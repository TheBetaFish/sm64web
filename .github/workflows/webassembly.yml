name: Experimental WebAssembly build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/emscripten-web-build
      - work/web-multiplayer-networking
      - work/web-audio-experiment

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  webassembly:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Show toolchain
        run: |
          emcc --version
          command -v emmake

      - name: Build Lua for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o /tmp/lua-5.3.6.tar.gz
          tar -xzf /tmp/lua-5.3.6.tar.gz -C /tmp
          emmake make -C /tmp/lua-5.3.6/src generic CC=emcc 'AR=emar rcs' RANLIB=emranlib
          mkdir -p lib/lua/emscripten
          cp /tmp/lua-5.3.6/src/liblua.a lib/lua/emscripten/liblua53.a

      - name: Rebuild audio banks with wasm32 pointer layout
        shell: bash
        run: |
          set -euxo pipefail
          make -C tools
          mapfile -t sample_targets < <(find sound/samples -type f -name '*.aiff' -print | sed 's#^sound/#build/us_pc/sound/#; s/\.aiff$/.aifc/')
          make -j2 "${sample_targets[@]}"
          python3 tools/assemble_web_audio.py --endian little --bitwidth 64 \
            build/us_pc/sound/samples sound/sound_banks \
            build/us_pc/sound/sound_data.ctl build/us_pc/sound/ctl_header \
            sound/sound_data.tbl build/us_pc/sound/tbl_header

      - name: Prepare zlib headers for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://zlib.net/fossils/zlib-1.3.1.tar.gz -o /tmp/zlib-1.3.1.tar.gz
          tar -xzf /tmp/zlib-1.3.1.tar.gz -C /tmp

      - name: Attempt browser build
        shell: bash
        run: |
          set -o pipefail
          emmake make -j2 CC=emcc CXX=em++ CC_CHECK=emcc DISCORD_SDK=0 COOPNET=0 UPDATER=0 ICON=0 EXE=build/us_pc/sm64coopdx.html EXTRA_CFLAGS="-I/tmp/zlib-1.3.1 -DUSE_GLES=1" LDFLAGS="-sUSE_SDL=2 -sUSE_ZLIB=1 -sMIN_WEBGL_VERSION=1 -sMAX_WEBGL_VERSION=1 -sALLOW_MEMORY_GROWTH=1 -sASSERTIONS=2 -sSAFE_HEAP=0 -sSTACK_OVERFLOW_CHECK=2 -sSTACK_SIZE=1048576 -sDEMANGLE_SUPPORT=1 -sEXPORTED_RUNTIME_METHODS=allocateUTF8,_free -g --profiling-funcs -gsource-map -Llib/lua/emscripten -llua53 -lm" 2>&1 | tee emscripten-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-build-log
          path: emscripten-build.log
          if-no-files-found: ignore

      - name: Upload browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sm64web-wasm
          path: |
            build/us_pc/*.html
            build/us_pc/*.js
            build/us_pc/*.wasm
            build/us_pc/*.data
          if-no-files-found: error

      - name: Prepare GitHub Pages site
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          cp build/us_pc/*.html site/
          cp build/us_pc/*.js build/us_pc/*.wasm site/
          cp build/us_pc/*.data site/ 2>/dev/null || true
          test -f site/sm64coopdx.html
          cp site/sm64coopdx.html site/index.html
          cp web/rom-upload.js site/rom-upload.js
          cp web/sm64web.css site/sm64web.css
          cp web/sm64web-ui.js site/sm64web-ui.js
          cp web/sm64web-relay-transport.js site/sm64web-relay-transport.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path("site/index.html")
          html = page.read_text()
          version = __import__("os").environ.get("GITHUB_SHA", "dev")
          html = html.replace("</head>", '<link rel="stylesheet" href="sm64web.css?v=' + version + '"></head>', 1)
          html = html.replace("</body>", '<script defer src="sm64web-relay-transport.js?v=' + version + '"></script><script defer src="sm64web-ui.js?v=' + version + '"></script></body>', 1)
          html, count = re.subn(
              r"""(<script\b[^>]*\bsrc=["'][^"']+\.js["'][^>]*>)""",
              r"""<script src="rom-upload.js"></script>\n\1""",
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate the Emscripten runtime script in index.html")
          html, script_count = re.subn(
              r"(<script\b[^>]*\bsrc=['\"]sm64coopdx\.js)(['\"])",
              lambda m: m.group(1) + "?v=" + version + m.group(2),
              html,
              count=1,
          )
          if script_count != 1:
              raise SystemExit("Could not locate sm64coopdx.js script URL for cache-busting")
          js_path = Path("site/sm64coopdx.js")
          if not js_path.exists():
              raise SystemExit("Expected site/sm64coopdx.js was not produced")
          js = js_path.read_text()
          js, wasm_count = re.subn(
              r"(['\"])sm64coopdx\.wasm\1",
              lambda m: m.group(1) + "sm64coopdx.wasm?v=" + version + m.group(1),
              js,
              count=1,
          )
          if wasm_count != 1:
              raise SystemExit("Could not locate sm64coopdx.wasm URL for cache-busting")
          js_path.write_text(js)
          page.write_text(html)
          PY

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
