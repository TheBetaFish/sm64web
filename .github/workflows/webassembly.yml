name: Experimental WebAssembly build

on:
  workflow_dispatch:
  push:
    branches:
      - ci/emscripten-web-build

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  webassembly:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Show toolchain
        run: |
          emcc --version
          command -v emmake

      - name: Build Lua for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o /tmp/lua-5.3.6.tar.gz
          tar -xzf /tmp/lua-5.3.6.tar.gz -C /tmp
          emmake make -C /tmp/lua-5.3.6/src generic CC=emcc 'AR=emar rcs' RANLIB=emranlib
          mkdir -p lib/lua/emscripten
          cp /tmp/lua-5.3.6/src/liblua.a lib/lua/emscripten/liblua53.a

      - name: Prepare zlib headers for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://zlib.net/fossils/zlib-1.3.1.tar.gz -o /tmp/zlib-1.3.1.tar.gz
          tar -xzf /tmp/zlib-1.3.1.tar.gz -C /tmp

      - name: Attempt browser build
        shell: bash
        run: |
          set -o pipefail
          emmake make -j2 CC=emcc CXX=em++ CC_CHECK=emcc DISCORD_SDK=0 COOPNET=0 UPDATER=0 ICON=0 EXE=build/us_pc/sm64coopdx.html EXTRA_CFLAGS="-I/tmp/zlib-1.3.1 -DUSE_GLES=1" LDFLAGS="-sUSE_SDL=2 -sUSE_ZLIB=1 -sMIN_WEBGL_VERSION=1 -sMAX_WEBGL_VERSION=1 -sALLOW_MEMORY_GROWTH=1 -Llib/lua/emscripten -llua53 -lm" 2>&1 | tee emscripten-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-build-log
          path: emscripten-build.log
          if-no-files-found: ignore

      - name: Upload browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sm64web-wasm
          path: |
            build/us_pc/*.html
            build/us_pc/*.js
            build/us_pc/*.wasm
            build/us_pc/*.data
          if-no-files-found: error

      - name: Prepare GitHub Pages site
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site
          cp build/us_pc/*.html site/
          cp build/us_pc/*.js build/us_pc/*.wasm site/
          cp build/us_pc/*.data site/ 2>/dev/null || true
          test -f site/sm64coopdx.html
          cp site/sm64coopdx.html site/index.html

      - name: Configure GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
